[workspace]
name = "portfolio-neo"
version = "0.1.0"
description = "Minimal developer portfolio with dynamic resume configurations"
authors = ["Pawan Parida <135092407+zer-art@users.noreply.github.com>"]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64", "win-64"]

[dependencies]
nodejs = ">=20.0.0"

[tasks]
install = "npm install"
dev = "npm run dev"
build = "npm run build"
deploy = "npm run deploy"
sync-data = { cmd = "python src/sync_to_portfolio.py", cwd = "../AutoCV" }
